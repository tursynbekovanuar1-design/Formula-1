    <main>
    <section class="gallery-section">
        <h2>F1 Grand Prix Photo Gallery</h2>
        <div class="gallery-container">
            
            <div class="gallery-item">
                <img src="images/monaco.jpg" alt="F1 Car">
                <div class="caption">Monaco GP</div>
            </div>
            
            <div class="gallery-item">
                <img src="images/celebration.jpg" alt="F1 Driver">
                <div class="caption">Podium Celebration</div>

            <div class="gallery-item">
                <img src="images/pitstop.jpg" alt="F1 Pit Stop">
                <div class="caption">Lightning Pit Stop</div>

            <div class="gallery-item">
                <img src="images/gridstart.jpg" alt="F1 Start">
                <div class="caption">Grid Start</div>
            </div>
            
            <div class="gallery-item">
                <img src="images/corner.jpg" alt="F1 Corner">
                <div class="caption">High-Speed Corner</div>
            </div>
            
            <div class="gallery-item">
                <img src="images/trophy.jpg" alt="F1 Trophy">

            </div>
            
            <div class="gallery-item">
                <img src="images/nightrace.jpg" alt="F1 Night Race">

            </div>
            
            <div class="gallery-item">
                <img src="images/garage.jpg" alt="F1 Garage">
                <div class="caption">Team Garage</div>
            </div>
            
            <div class="gallery-item">
                <img src="images/flag.jpg" alt="F1 Finish">
