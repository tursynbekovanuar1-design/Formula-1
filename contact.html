<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formula 1 | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav id="main-nav">
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="teams.html">Teams</a></li>
            <li><a href="drivers.html">Drivers</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header id="main-header">
        <h1>F1 Fan Club</h1>
    </header>

    <main>
        <section>
            <h2>Fan Club Registration</h2>
            <p>Join the global community of Formula 1 enthusiasts and get the latest updates.</p>

            <div class="content-image">
                <img src="images/fans.jpg" alt="Grandstand atmosphere at a Grand Prix" width="800">
            </div>

            <form>
                <label>Name:</label>
                <input type="text" placeholder="Your name" required>

                <label>Email:</label>
                <input type="email" placeholder="example@mail.com" required>

                <label>Favorite Team:</label>
                <select>
                    <option>Red Bull</option>
                    <option>Ferrari</option>
                    <option>Mercedes</option>
                    <option>McLaren</option>
                    <option>Haas</option>
                    <option>Williams</option>
                    <option>Aston Martin</option>
                </select>

                <label>Favorite Livery Color:</label>
                <input type="color" value="#ff1801">

                <label>Message:</label>
                <textarea rows="4" placeholder="Your feedback..."></textarea>

                <button type="submit">Submit Application</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Developers: Anuar Tursynbekov & Zhanaiym Sadyk</p>
    </footer>

</body>
</html>
