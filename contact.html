    <header>
            <nav id="main-nav" class="navbar navbar-expand-lg navbar-dark px-4">
                <div class="container-fluid">
                    <a class="logo" href="index.html">F1 PORTAL</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

            </div>

    <header id="main-header">
        <h1>Get in Touch</h1>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <form>
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" class="form-control mb-3">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" class="form-control mb-3">

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Type your message here..." class="form-control mb-3"></textarea>

                <button type="submit" class="btn btn-danger w-100 font-weight-bold">Send Message</button>
            </form>
        </section>
    </main>
